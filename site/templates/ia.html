{% extends 'base.html' %}

{% block titre %}Assistant IA{% endblock %}

{% block contenu %}

<div class="chart-card" style="max-width:800px;margin:0 auto">
    <div class="chart-header">
        <div class="chart-title">Assistant IA — Emploi Sénégal</div>
        <div class="chart-badge">Gemini</div>
    </div>

    <div id="chat-body" style="height:400px;overflow-y:auto;padding:16px;background:#f0f4f8;border-radius:8px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px">
        <div class="msg-bot">Bonjour ! Je suis votre assistant spécialisé sur les offres d'emploi au Sénégal. Posez-moi vos questions !</div>
    </div>

    <div style="display:flex;gap:8px">
        <input type="text" id="chat-input" placeholder="Posez votre question..." style="flex:1;padding:10px 14px;border:0.5px solid #dce3ec;border-radius:8px;font-size:13px;outline:none">
        <button onclick="envoyerMessage()" style="padding:10px 20px;background:#0d2b4e;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer">Envoyer</button>
    </div>
</div>

<style>
.msg-user {
    background: #0d2b4e;
    color: white;
    padding: 10px 14px;
    border-radius: 12px 12px 2px 12px;
    font-size: 13px;
    align-self: flex-end;
    max-width: 75%;
}
.msg-bot {
    background: white;
    color: #4a6080;
    padding: 10px 14px;
    border-radius: 12px 12px 12px 2px;
    font-size: 13px;
    align-self: flex-start;
    max-width: 75%;
    border: 0.5px solid #dce3ec;
}
</style>

<script>
document.getElementById('chat-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyerMessage();
});

async function envoyerMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    const chatBody = document.getElementById('chat-body');

    const msgUser = document.createElement('div');
    msgUser.className = 'msg-user';
    msgUser.textContent = message;
    chatBody.appendChild(msgUser);

    input.value = '';

    const typing = document.createElement('div');
    typing.className = 'msg-bot';
    typing.textContent = '...';
    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;

    const response = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: message})
    });

    const data = await response.json();
    typing.textContent = data.response;
    chatBody.scrollTop = chatBody.scrollHeight;
}
</script>

{% endblock %}
